<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merci ! — Nitrello</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <meta name="theme-color" content="#00BFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nitrello">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --bg-primary:   #0A0A0F;
      --bg-secondary: #0D0D1A;
      --blue:  #00BFFF;
      --purple:#7B2FFF;
      --grad:  linear-gradient(135deg, #00BFFF, #7B2FFF);
      --text:  #FFFFFF;
      --muted: #A0A0B0;
      --dim:   #6B6B80;
      --border:rgba(255,255,255,0.07);
      --font: 'Inter', sans-serif;
    }

    html { scroll-behavior:smooth; font-size:16px; }
    body {
      font-family: var(--font);
      background: var(--bg-primary);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: sticky; top:0; z-index:100;
      background: rgba(10,10,15,.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    .hdr-inner {
      max-width:1180px; margin:0 auto;
      display:flex; align-items:center; justify-content:space-between;
      height: 68px;
    }
    .logo { display:flex; align-items:center; text-decoration:none; opacity:1; transition:opacity .3s; }
    .logo:hover { opacity:.85; }

    /* ── Main ── */
    main {
      flex:1; display:flex; align-items:center; justify-content:center;
      padding: 80px 24px;
      position:relative; overflow:hidden;
    }
    .glow-bg {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      width:700px; height:400px; pointer-events:none;
      background:radial-gradient(ellipse, rgba(0,191,255,.06), rgba(123,47,255,.06), transparent 70%);
    }

    .card {
      position:relative; z-index:1;
      background:rgba(255,255,255,.025);
      border:1px solid rgba(0,191,255,.15);
      border-radius:28px; padding:64px 56px;
      max-width:540px; width:100%;
      text-align:center;
      backdrop-filter:blur(10px);
    }
    .card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:1px;
      background: var(--grad); border-radius:28px 28px 0 0;
    }

    .check-icon {
      width:72px; height:72px; border-radius:50%; margin:0 auto 28px;
      background:linear-gradient(135deg, rgba(0,191,255,.12), rgba(123,47,255,.12));
      border:1.5px solid rgba(0,191,255,.3);
      display:flex; align-items:center; justify-content:center;
      animation: popIn .5s cubic-bezier(.22,1,.36,1) both;
    }
    .check-icon svg { width:32px; height:32px; color:#00BFFF; }
    @keyframes popIn {
      from { transform:scale(.5); opacity:0; }
      to   { transform:scale(1);  opacity:1; }
    }

    .card h1 {
      font-family:'Plus Jakarta Sans', var(--font);
      font-size:clamp(1.6rem, 4vw, 2.2rem);
      font-weight:800; margin-bottom:16px;
      background: var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .card p {
      color: var(--muted); font-size:1rem; line-height:1.75; margin-bottom:36px;
    }
    .card p em {
      font-style:normal; color:rgba(255,255,255,.45);
      display:block; margin-top:8px;
    }

    .btn-back {
      display:inline-flex; align-items:center; gap:8px;
      padding:14px 28px; border-radius:12px;
      font-family:var(--font); font-size:.9rem; font-weight:600; color:#fff;
      background:linear-gradient(135deg,#00BFFF,#7B2FFF);
      background-size:200% 200%; background-position:0% 50%;
      text-decoration:none; border:none;
      transition:background-position .4s ease, transform .25s ease, box-shadow .25s ease;
      box-shadow:0 0 22px rgba(0,191,255,.2);
    }
    .btn-back:hover {
      background-position:100% 50%;
      transform:translateY(-2px);
      box-shadow:0 8px 28px rgba(0,191,255,.35);
    }

    /* ── Footer ── */
    footer {
      background:#07070E; border-top:1px solid var(--border);
      padding:32px 24px; text-align:center;
    }
    .ft-bot { max-width:1180px; margin:0 auto; }
    .ft-bot p { color:var(--dim); font-size:.82rem; }

    @media(max-width:600px) {
      .card { padding:40px 24px; }
    }
  </style>
</head>
<body>

<header>
  <div class="hdr-inner">
    <a href="index.html" class="logo">
      <svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Nitrello">
        <defs>
          <linearGradient id="lg-bubble" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00BFFF"/>
            <stop offset="100%" stop-color="#7B2FFF"/>
          </linearGradient>
          <linearGradient id="lg-n" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00BFFF"/>
            <stop offset="100%" stop-color="#7B2FFF"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="21" r="18" stroke="url(#lg-bubble)" stroke-width="2" fill="none"/>
        <path d="M12 36 C10 39 6 41 4 43 C8 41 14 40 16 37 Z" fill="url(#lg-bubble)"/>
        <text x="24" y="27" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="16" text-anchor="middle" fill="url(#lg-n)">N</text>
        <text x="52" y="25" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="20" fill="white" letter-spacing="-0.3">Nitrello</text>
        <text x="53" y="38" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#A0A0B0" letter-spacing="1.5">BUBBLE · MOBILE · WEB</text>
      </svg>
    </a>
  </div>
</header>

<main>
  <div class="glow-bg"></div>
  <div class="card">
    <div class="check-icon">
      <i data-lucide="check" style="width:32px;height:32px;color:#00BFFF;"></i>
    </div>
    <h1>Merci pour votre message&nbsp;!</h1>
    <p>
      J'ai bien reçu votre demande et je vous recontacte sous 24h.
      <em>— Nicolas</em>
    </p>
    <a href="index.html" class="btn-back">
      <i data-lucide="arrow-left" style="width:15px;height:15px;"></i>
      Retour au site
    </a>
  </div>
</main>

<footer>
  <div class="ft-bot">
    <p>© 2026 Nitrello · Nicolas Tinnirello · Tous droits réservés</p>
  </div>
</footer>

<script>lucide.createIcons();</script>
</body>
</html>
