<style>
  :root {
    --ink: #0F0F14;
    --ink-soft: #16161D;
    --paper: #F5F1EA;
    --cyan: #00BFFF;
    --violet: #7B2FFF;
    --stone: #B5B5AC;
    --stone-dim: #6E6E66;
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--ink);
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Fond ambiant : halo radial cyan/violet + trame de points */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 30% 20%, rgba(0,191,255,0.18), transparent 60%),
      radial-gradient(ellipse 70% 60% at 75% 85%, rgba(123,47,255,0.18), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(245,241,234,0.05) 1px, transparent 1px);
    background-size: 22px 22px;
    pointer-events: none;
    z-index: 0;
  }

  /* Bouton retour */
  .back {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(245,241,234,0.06);
    border: 1px solid rgba(245,241,234,0.12);
    color: var(--paper);
    text-decoration: none;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background 0.2s, border-color 0.2s;
  }
  .back:hover { background: rgba(245,241,234,0.1); border-color: rgba(245,241,234,0.22); }
  .back svg { width: 14px; height: 14px; }

  /* Mise en page principale */
  .wrap {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px 40px;
    gap: 28px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  /* Carte 3D */
  .card-stage {
    width: 100%;
    perspective: 1400px;
    perspective-origin: 50% 30%;
  }
  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 85 / 55;
    transform-style: preserve-3d;
    transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    cursor: pointer;
    border-radius: 14px;
    will-change: transform;
  }
  .card.is-flipped { transform: rotateY(180deg); }
  .card:focus-visible { outline: 2px solid var(--cyan); outline-offset: 6px; }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--ink-soft);
    box-shadow:
      0 1px 0 rgba(245,241,234,0.05) inset,
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 0 1px rgba(245,241,234,0.06);
  }

  .face-inner {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    overflow: hidden;
    isolation: isolate;
  }

  /* === RECTO === */
  .face--front .face-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .face--front .face-inner::before {
    content: '';
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(ellipse 50% 50% at 30% 40%, rgba(0,191,255,0.30), transparent 65%),
      radial-gradient(ellipse 50% 50% at 75% 65%, rgba(123,47,255,0.32), transparent 65%);
    filter: blur(8px);
  }
  .strip {
    position: absolute;
    left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    z-index: 2;
  }
  .strip--bottom { bottom: 0; }
  .strip--top { top: 0; }
  .recto {
    position: relative;
    z-index: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .logo-n { width: clamp(54px, 12vw, 72px); height: auto; display: block; }
  .wordmark {
    font-family: var(--sans);
    font-weight: 600;
    font-size: clamp(24px, 6vw, 32px);
    letter-spacing: -0.02em;
    color: var(--paper);
  }
  .tagline {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(14px, 3.6vw, 18px);
    color: var(--stone);
    margin-top: 2px;
  }

  /* === VERSO === */
  .face--back {
    transform: rotateY(180deg);
  }
  .face--back .face-inner {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    padding: clamp(16px, 4.5vw, 22px);
    align-items: center;
  }
  .face--back .face-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,191,255,0.06), transparent 40%, rgba(123,47,255,0.08));
    pointer-events: none;
  }
  .verso-info {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .verso-name {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(18px, 4.6vw, 24px);
    color: var(--paper);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  .verso-role {
    font-family: var(--mono);
    font-size: clamp(8.5px, 2vw, 10px);
    color: var(--cyan);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .verso-meta {
    font-family: var(--sans);
    font-weight: 400;
    font-size: clamp(9px, 2.2vw, 10.5px);
    color: var(--stone-dim);
    line-height: 1.4;
    margin-bottom: 6px;
  }
  .verso-contact {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-family: var(--sans);
    font-size: clamp(10px, 2.4vw, 12px);
    color: var(--stone);
    line-height: 1.35;
    word-break: break-word;
  }
  .verso-contact span { display: block; }
  .verso-qr {
    position: relative;
    z-index: 1;
    width: clamp(72px, 18vw, 92px);
    aspect-ratio: 1;
    background: var(--paper);
    border-radius: 6px;
    padding: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .verso-qr svg { width: 100%; height: 100%; display: block; }

  /* Indicateur "tape pour retourner" */
  .flip-hint {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--stone-dim);
    text-align: center;
    transition: opacity 0.4s ease;
    user-select: none;
  }
  .flip-hint.is-hidden { opacity: 0; pointer-events: none; }

  /* === BOUTONS D'ACTION === */
  .actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    width: 100%;
  }
  .action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 52px;
    padding: 12px 14px;
    border-radius: 12px;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 14px;
    color: var(--paper);
    background: rgba(245,241,234,0.06);
    border: 1px solid rgba(245,241,234,0.12);
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .action:hover, .action:focus-visible {
    background: rgba(245,241,234,0.10);
    border-color: rgba(245,241,234,0.22);
    outline: none;
  }
  .action:active { transform: scale(0.98); }
  .action--primary {
    background: linear-gradient(95deg, var(--cyan), var(--violet));
    border-color: transparent;
    color: var(--ink);
    font-weight: 600;
  }
  .action--primary:hover, .action--primary:focus-visible {
    background: linear-gradient(95deg, var(--cyan), var(--violet));
    filter: brightness(1.1);
    border-color: transparent;
  }
  .action svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* Toast partage */
  .toast {
    position: fixed;
    left: 50%;
    bottom: max(24px, env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--paper);
    color: var(--ink);
    padding: 12px 18px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 10px 30px -8px rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 20;
  }
  .toast.is-visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Adaptations layout */
  @media (min-width: 520px) {
    .actions { grid-template-columns: repeat(4, 1fr); }
    .action { font-size: 13px; }
  }

  /* Reduce motion */
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .toast { transition: opacity 0.2s; }
  }
</style>
</head>

<script>
  (function () {
    var card = document.getElementById('card');
    var hint = document.getElementById('flip-hint');
    var shareBtn = document.getElementById('share-btn');
    var toast = document.getElementById('toast');
    var hasFlipped = false;

    function flip() {
      var flipped = card.classList.toggle('is-flipped');
      card.setAttribute('aria-pressed', flipped ? 'true' : 'false');
      var front = card.querySelector('.face--front');
      var back = card.querySelector('.face--back');
      if (front) front.setAttribute('aria-hidden', flipped ? 'true' : 'false');
      if (back) back.setAttribute('aria-hidden', flipped ? 'false' : 'true');
      if (!hasFlipped) {
        hasFlipped = true;
        hint.classList.add('is-hidden');
      }
    }

    card.addEventListener('click', flip);
    card.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        flip();
      }
    });

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('is-visible');
      setTimeout(function () {
        toast.classList.remove('is-visible');
      }, 2200);
    }

    shareBtn.addEventListener('click', async function () {
      var data = {
        title: 'Nicolas Tinnirello — Nitrello',
        text: 'Développeur freelance — Apps Web & Mobile, SaaS, MVP, Automatisations IA',
        url: 'https://nitrello.com/card'
      };
      try {
        if (navigator.share) {
          await navigator.share(data);
          return;
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(data.url);
          showToast('Lien copié');
          return;
        }
      } catch (err) { /* fallback ci-dessous */ }
      try {
        var ta = document.createElement('textarea');
        ta.value = data.url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Lien copié');
      } catch (err) {
        showToast('Copie impossible');
      }
    });
  })();
</script>
